# Free mock demo. The local SQLite database is ephemeral on this plan.
# No paid resources or AI credentials are required.
services:
  - type: web
    name: comiclingo-demo
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: LLM_PROVIDER
        value: mock
      - key: DATA_DIR
        value: /tmp/comiclingo
